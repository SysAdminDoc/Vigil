ShortDescription: A lean, privacy-respecting Chromium fork with sensible defaults — like Brave, without the bloat.
Description: |
  Vigil is a Windows-first Chromium fork built on ungoogled-chromium-windows.
  It ships uBlock Origin pre-installed, HTTPS-First mode enabled by default,
  Privacy Sandbox APIs disabled, no telemetry, no crypto features, no in-browser
  LLM, and no integrated VPN service. The browser is BSD-3-Clause licensed and
  packaged for IT admins, sysadmins, and privacy-curious power users.
