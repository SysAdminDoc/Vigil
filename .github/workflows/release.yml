name: Release validation

on:
  workflow_dispatch:
    inputs:
      upstream_metadata:
        description: JSON object for the reviewed upstream stable/security refresh metadata
        required: true
        type: string
      build:
        description: Run the full Windows Chromium build and package smoke test
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  gate:
    name: Release gate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tools
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Materialize reviewed upstream metadata
        shell: pwsh
        env:
          VIGIL_UPSTREAM_METADATA: ${{ inputs.upstream_metadata }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VIGIL_UPSTREAM_METADATA)) {
            throw 'upstream_metadata input is required'
          }
          [System.IO.File]::WriteAllText(
            'upstream-release.json',
            $env:VIGIL_UPSTREAM_METADATA,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Run release freshness gate
        run: >-
          python devutils/release_gate.py
          --metadata upstream-release.json
          --format json
          --output build/release-gate.json

      - name: Run release tests and lint
        run: |
          python -m pytest -q
          python -m ruff check .

      - name: Upload gate receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vigil-release-gate
          path: build/release-gate.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: Windows build and package
    needs: gate
    if: ${{ inputs.build == true }}
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install build and test tools
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements.txt
          python -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Build and package x64
        run: python build.py --ci -j 2

      - name: Run packaged smoke test
        run: python devutils/smoke_test.py --build-out build/src/out/Default

      - name: Enforce package-manager hashes and write strict receipt
        run: >-
          python devutils/release_receipt.py
          --artifact-dir build
          --output build/strict-release-receipt.json
          --strict-manifests
          --update-manifests

      - name: Upload reviewable build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vigil-windows-x64
          path: |
            build/*.exe
            build/*.msi
            build/*.zip
            build/*receipt.json
          if-no-files-found: error
          retention-days: 14
