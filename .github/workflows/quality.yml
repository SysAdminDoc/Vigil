name: Quality

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tools
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run linter
        run: python -m ruff check .

      - name: Run offline privacy probe
        run: python devutils/privacy_probe.py

      - name: Check extension JavaScript
        shell: pwsh
        run: |
          Get-ChildItem -Path ntp-extension,palette-extension -Filter *.js -File |
            ForEach-Object { node --check $_.FullName }

      - name: Validate checked-in JSON
        shell: pwsh
        run: |
          $files = @(
            'branding.json',
            'initial_preferences',
            'toolchain.json',
            'release_policy.json',
            'extension_sources.json',
            'policies/vigil-defaults.json',
            'policies/vigil-extension-forcelist.json',
            'policies/vigil-kiosk.json',
            'ntp-extension/manifest.json',
            'palette-extension/manifest.json'
          )
          foreach ($file in $files) {
            Get-Content -Raw -LiteralPath $file | ConvertFrom-Json | Out-Null
          }

      - name: Compile Python entrypoints
        run: python -m compileall -q -f apply_overlays.py build.py package.py setup_extensions.py devutils tools branding
