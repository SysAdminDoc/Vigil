<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vigil Command Palette</title>
  <link rel="stylesheet" href="palette.css">
</head>
<body>
  <main id="palette" role="dialog" aria-modal="true" aria-labelledby="palette-title">
  <header>
      <div class="eyebrow">VIGIL COMMAND PALETTE</div>
      <h1 id="palette-title">What do you want to open?</h1>
    <input id="query" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search settings, tabs, bookmarks, or history"
             aria-label="Search commands" aria-controls="results" aria-autocomplete="list">
    </header>
    <div id="status" role="status" aria-live="polite"></div>
    <ul id="results" role="listbox" aria-label="Palette results"></ul>
    <footer><kbd>↑</kbd><kbd>↓</kbd> navigate <kbd>Enter</kbd> open <kbd>Esc</kbd> close</footer>
  </main>
  <script src="palette.js"></script>
</body>
</html>
